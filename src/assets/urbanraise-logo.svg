<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-label="UrbanRaise Building Works — Smart Design, Solid Buildings">
  <title>UrbanRaise Building Works</title>
  <!--
    Vector redraw of the supplied logo. The mark and diamond frame are true
    vector. The wordmark uses Space Grotesk (the website's display face) — for
    a final master file a designer should convert the type to outline paths.
  -->
  <g fill="none" stroke="#5B2A86" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 300 L500 120 L880 300" />
    <path d="M120 470 L500 650 L880 470" />
  </g>

  <!-- mark -->
  <g transform="translate(378 96) scale(0.78)">
    <path d="M76 252 V130 H58 L150 58 L242 130 H224 V252 Z" fill="#5B2A86" />
    <g fill="none" stroke="#fff" stroke-width="9.5" stroke-linecap="round">
      <path d="M150 72 L150 94 A15 15 0 1 1 150 110 L150 194 A15 15 0 1 0 150 210 L150 252" />
      <path d="M76 150 L100 150 A15 15 0 1 0 116 150 L184 150 A15 15 0 1 1 200 150 L224 150" />
    </g>
  </g>

  <!-- wordmark (stacked, matches the website) -->
  <text x="500" y="392" text-anchor="middle"
        font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif"
        font-weight="700" font-size="86" letter-spacing="-2" fill="#5B2A86">UrbanRaise</text>
  <text x="500" y="436" text-anchor="middle"
        font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif"
        font-weight="600" font-size="26" letter-spacing="13" fill="#5B2A86">BUILDING WORKS</text>

  <!-- tagline -->
  <g stroke="#5B2A86" stroke-width="3" stroke-linecap="round">
    <line x1="196" y1="474" x2="300" y2="474" />
    <line x1="700" y1="474" x2="804" y2="474" />
  </g>
  <text x="500" y="482" text-anchor="middle"
        font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif"
        font-weight="600" font-size="20" letter-spacing="2.5" fill="#5B2A86">SMART DESIGN, SOLID BUILDINGS</text>
</svg>
