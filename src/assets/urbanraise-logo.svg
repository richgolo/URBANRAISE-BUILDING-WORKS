<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="UrbanRaise Building Works — Smart Design, Solid Buildings">
  <title>UrbanRaise Building Works</title>
  <!--
    Vector redraw of the supplied logo. Mark + diamond frame are true vector.
    Wordmark/tagline use a live web font (Saira Condensed / Oswald fallback)
    forced to width with textLength. For a final production logo file a
    designer should convert the type to outlines so it is font-independent.
  -->
  <g fill="none" stroke="#5B2A86" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 250 L500 90 L890 250" />
    <path d="M110 400 L500 560 L890 400" />
  </g>

  <!-- mark -->
  <g transform="translate(386 60) scale(0.76)">
    <path d="M80 250 V124 H66 L152.5 56 L239 124 H225 V250 Z" fill="#5B2A86" />
    <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round">
      <path d="M152.5 60 L152.5 84 A16 16 0 0 0 152.5 116 L152.5 150" />
      <path d="M152.5 150 L152.5 182 A16 16 0 1 0 152.5 214 L152.5 250" />
      <path d="M80 150 L100 150 A16 16 0 0 1 132 150 L152.5 150" />
      <path d="M152.5 150 L173 150 A16 16 0 0 0 205 150 L225 150" />
    </g>
  </g>

  <!-- wordmark -->
  <text x="500" y="352" text-anchor="middle" textLength="700" lengthAdjust="spacingAndGlyphs"
        font-family="'Saira Condensed','Oswald','Arial Narrow',system-ui,sans-serif"
        font-weight="700" fill="#5B2A86" font-size="70">URBANRAISE BUILDING WORKS</text>

  <!-- tagline -->
  <g stroke="#5B2A86" stroke-width="3" stroke-linecap="round">
    <line x1="196" y1="392" x2="360" y2="392" />
    <line x1="640" y1="392" x2="804" y2="392" />
  </g>
  <text x="500" y="401" text-anchor="middle" textLength="250" lengthAdjust="spacingAndGlyphs"
        font-family="'Saira Condensed','Oswald','Arial Narrow',system-ui,sans-serif"
        font-weight="600" fill="#5B2A86" font-size="24">SMART DESIGN, SOLID BUILDINGS</text>
</svg>
